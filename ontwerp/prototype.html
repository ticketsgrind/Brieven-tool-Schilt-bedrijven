<title>Offertebrieven Schilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E4E8EA; --surface:#F5F7F8; --raised:#FFFFFF;
  --ink:#14211F; --muted:#5E7070; --faint:#849797;
  --line:#CBD4D5; --line-soft:#DCE3E4;
  --accent:#0F6E6A; --accent-ink:#FFFFFF; --accent-soft:#D7E8E6;
  --signal:#A8641B; --signal-soft:#F2E4D0;
  --paper:#FBF9F5; --paper-ink:#23201B; --paper-line:#DAD5CA;
  --shadow:0 1px 2px rgba(20,33,31,.06), 0 8px 24px rgba(20,33,31,.08);
  --ui:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --brief:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#10181A; --surface:#172224; --raised:#1D292B;
  --ink:#DFE8E7; --muted:#93A5A4; --faint:#6E8281;
  --line:#2C3B3D; --line-soft:#243133;
  --accent:#4FB3AC; --accent-ink:#0B1516; --accent-soft:#1B3634;
  --signal:#D89A4A; --signal-soft:#33281A;
  --paper:#E9E5DD; --paper-ink:#23201B; --paper-line:#C9C3B6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#10181A; --surface:#172224; --raised:#1D292B;
  --ink:#DFE8E7; --muted:#93A5A4; --faint:#6E8281;
  --line:#2C3B3D; --line-soft:#243133;
  --accent:#4FB3AC; --accent-ink:#0B1516; --accent-soft:#1B3634;
  --signal:#D89A4A; --signal-soft:#33281A;
  --paper:#E9E5DD; --paper-ink:#23201B; --paper-line:#C9C3B6;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- kop ---------- */
.kop{display:flex;align-items:center;gap:18px;padding:0 18px;height:56px;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;flex-wrap:wrap}
.merk{display:flex;align-items:baseline;gap:9px;font-weight:700;letter-spacing:-.015em;font-size:15px}
.merk .bu{font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em}
.kop-mid{flex:1;min-width:120px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.kenmerk{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.kenmerk b{color:var(--ink);font-weight:500}
.kop-acties{display:flex;align-items:center;gap:8px}

.knop{background:var(--raised);border:1px solid var(--line);border-radius:6px;
  padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:border-color .12s,background .12s}
.knop:hover{border-color:var(--muted)}
.knop.aan{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}
.knop.hoofd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.knop.hoofd:hover{filter:brightness(1.08)}
.stip{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.knop.aan .stip{opacity:1}

/* ---------- werkblad ---------- */
.blad{display:grid;grid-template-columns:minmax(340px,400px) 1fr;
  height:calc(100dvh - 56px)}
@media (max-width:900px){.blad{grid-template-columns:1fr;height:auto}}

/* ---------- vragen ---------- */
.vragen{overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);
  padding:14px 14px 60px;display:flex;flex-direction:column;gap:8px}
@media (max-width:900px){.vragen{border-right:0;border-bottom:1px solid var(--line);max-height:none}}

.groep{flex:none;background:var(--raised);border:1px solid var(--line-soft);border-radius:9px;overflow:hidden}
.groep[open]{border-color:var(--line)}
.groep>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;
  align-items:center;gap:10px;user-select:none}
.groep>summary::-webkit-details-marker{display:none}
.groep>summary:hover{background:var(--surface)}
.pijl{width:8px;height:8px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);
  transform:rotate(-45deg);transition:transform .15s;flex:none;margin-left:1px}
.groep[open]>summary .pijl{transform:rotate(45deg)}
.gtitel{font-weight:600;font-size:13px;letter-spacing:-.005em}
.gsamen{margin-left:auto;font-size:11.5px;color:var(--faint);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.groep[open] .gsamen{opacity:0}
.ginhoud{padding:4px 13px 15px;display:flex;flex-direction:column;gap:13px;
  border-top:1px solid var(--line-soft)}

.veld{display:flex;flex-direction:column;gap:5px}
.veld>label,.blabel{font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted)}
.rij{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rij3{display:grid;grid-template-columns:auto 1fr;gap:10px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:7px 9px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;font-size:13px;transition:border-color .12s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}
input.code,input.geld{font-family:var(--mono);font-size:12.5px}
textarea{resize:vertical;min-height:56px;font-size:13px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),
  linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

.segment{display:flex;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:2px;gap:2px}
.segment button{flex:1;border:0;background:transparent;border-radius:5px;padding:6px 8px;
  font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted);transition:.12s}
.segment button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.segment button:hover:not([aria-pressed=true]){color:var(--ink)}

.vink{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13px;padding:1px 0}
.vink input{margin:2px 0 0;accent-color:var(--accent);flex:none;width:15px;height:15px}
.vinklijst{display:flex;flex-direction:column;gap:3px;max-height:none}

.afgeleid{display:flex;gap:9px;align-items:flex-start;background:var(--signal-soft);
  border:1px solid color-mix(in srgb,var(--signal) 32%,transparent);
  border-radius:7px;padding:9px 11px;font-size:12.5px;line-height:1.45}
.afgeleid .merkje{color:var(--signal);font-weight:700;flex:none;font-size:13px;line-height:1.3}
.afgeleid b{font-weight:600}

.kaart{border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--surface);
  display:flex;flex-direction:column;gap:10px;position:relative}
.kaartkop{display:flex;align-items:center;gap:8px}
.kaartnr{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--accent);
  background:var(--accent-soft);border-radius:4px;padding:2px 6px;letter-spacing:.03em}
.weg{margin-left:auto;border:0;background:transparent;color:var(--faint);cursor:pointer;
  font-size:16px;line-height:1;padding:2px 5px;border-radius:4px}
.weg:hover{color:var(--signal);background:var(--signal-soft)}
.toevoeg{border:1px dashed var(--line);background:transparent;border-radius:8px;
  padding:9px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:.12s}
.toevoeg:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- brief ---------- */
.briefkant{overflow-y:auto;padding:26px 20px 70px;display:flex;flex-direction:column;
  align-items:center;gap:14px}
.briefbalk{width:100%;max-width:640px;display:flex;align-items:center;gap:10px;
  font-size:11.5px;color:var(--faint)}
.briefbalk .telling{font-family:var(--mono)}
.briefbalk .rest{margin-left:auto;display:flex;gap:8px;align-items:center}

.vel{width:100%;max-width:640px;background:var(--paper);color:var(--paper-ink);
  box-shadow:var(--shadow);border-radius:2px;padding:46px 52px 54px;
  font-family:var(--brief);font-size:12.4px;line-height:1.62}
@media (max-width:600px){.vel{padding:30px 26px 36px}}

.velkop{display:flex;justify-content:space-between;gap:24px;
  padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--paper-line)}
.velkop .naam{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.25}
.velkop .naam span{display:block;font-weight:400;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:#7A7266;margin-top:3px}
.velkop .plek{font-size:10.5px;color:#7A7266;text-align:right;line-height:1.55}

.sectie{margin:0 0 13px;position:relative}
.sectie:last-child{margin-bottom:0}
.alinea{margin:0 0 7px;white-space:pre-wrap;position:relative;border-radius:2px;
  transition:background .5s}
.alinea:last-child{margin-bottom:0}
.alinea.vers{background:color-mix(in srgb,var(--signal) 20%,transparent);transition:background 0s}
.alinea.kopregel{margin-top:16px}
.alinea.kopregel.onderstreept{text-decoration:underline;text-underline-offset:2px}
.alinea.kopregel.vet{font-weight:700}
.sectie:first-child .alinea.kopregel{margin-top:0}
.alinea.eigen{border-left:2px solid var(--accent);padding-left:9px;margin-left:-11px}
.alinea.opsomming{padding-left:16px;margin-bottom:1px}
.alinea.opsomming::before{content:"-";position:absolute;left:2px}
.alinea b{font-weight:700}

/* waarom-markering */
.waarom .alinea[data-waarom]{cursor:help}
.waarom .alinea[data-waarom]::before{content:"";position:absolute;left:-16px;top:3px;bottom:3px;
  width:2px;background:var(--signal);border-radius:1px}
.alinea[data-waarom]:hover .tip{opacity:1;transform:translateY(0);pointer-events:auto}
.tip{position:absolute;left:-16px;top:calc(100% + 5px);z-index:9;opacity:0;pointer-events:none;
  transform:translateY(-3px);transition:opacity .13s,transform .13s;
  background:var(--ink);color:var(--ground);font-family:var(--ui);font-size:11px;
  line-height:1.45;padding:6px 9px;border-radius:6px;max-width:290px;box-shadow:var(--shadow)}
.tip b{font-family:var(--mono);font-weight:500;font-size:10.5px}
body:not(.waarom) .tip{display:none}

.plus{position:absolute;right:-34px;top:0;width:24px;height:24px;border-radius:6px;
  border:1px dashed var(--paper-line);background:transparent;color:#9A9182;
  cursor:pointer;opacity:0;transition:.13s;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.sectie:hover .plus{opacity:1}
.plus:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
@media (max-width:760px){.plus{display:none}}

.leeg{color:#A79E8E;font-style:italic}
.velvoet{margin-top:30px;padding-top:14px;border-top:1px solid var(--paper-line);
  font-size:9px;color:#8C8478;line-height:1.5}

.legenda{width:100%;max-width:640px;display:flex;gap:16px;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);padding:2px 2px 0}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.staaf{width:2px;height:12px;border-radius:1px;background:var(--signal)}
.staaf.blauw{background:var(--accent)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="kop">
  <div class="merk">Brieventool <span class="bu">Schilt Airconditioning</span></div>
  <div class="kop-mid">
    <span class="kenmerk">Project&nbsp;no. <b id="k-project">—</b></span>
    <span class="kenmerk">Ref. <b id="k-ref">—</b></span>
  </div>
  <div class="kop-acties">
    <button class="knop" id="knop-waarom" aria-pressed="false">
      <span class="stip"></span>Toon waarom</button>
    <button class="knop hoofd" id="knop-word">Word-bestand maken</button>
  </div>
</header>

<main class="blad">
  <form class="vragen" id="vragen" autocomplete="off"></form>

  <section class="briefkant">
    <div class="briefbalk">
      <span class="telling" id="telling">—</span>
      <span class="rest"><span id="ontbreekt"></span></span>
    </div>
    <article class="vel" id="vel"></article>
    <div class="legenda">
      <span><i class="staaf"></i> door de tool gekozen — zet <b>Toon&nbsp;waarom</b> aan</span>
      <span><i class="staaf blauw"></i> eigen alinea</span>
      <span>zweef over een sectie voor <b>+</b></span>
    </div>
  </section>
</main>

<script>
"use strict";
const BLOKKEN = /*<blokken>*/[{"id":"adres_organisatie","sectie":"geadresseerde","v":"klanttype == 'zakelijk' and organisatie","g":"","o":"","stijl":"","t":"{{ organisatie }}"},{"id":"adres_contactpersoon","sectie":"geadresseerde","v":"aanspreekvorm != 'Fam.'","g":"","o":"","stijl":"","t":"T.a.v. {{ aanspreekvorm }} {{ voorletters }} {{ achternaam }}"},{"id":"adres_familie","sectie":"geadresseerde","v":"aanspreekvorm == 'Fam.'","g":"","o":"","stijl":"","t":"Fam. {{ achternaam }}"},{"id":"adres_regels","sectie":"geadresseerde","v":"","g":"","o":"","stijl":"","t":"{{ straat_huisnummer }}\n{{ postcode }}  {{ plaats }}"},{"id":"betreft","sectie":"betreft","v":"","g":"","o":"Betreft-regel","stijl":"label","t":"Betreft\t{{ betreft_onderwerp }} t.b.v. {{ locatieaanduiding }}"},{"id":"kenmerken","sectie":"kenmerken","v":"","g":"","o":"","stijl":"label","t":"Meerkerk\t{{ briefdatum }}\nOns project no. {{ projectnummer }}\nRef. {{ referentie }}"},{"id":"aanhef","sectie":"aanhef","v":"","g":"","o":"","stijl":"","t":"Geachte {{ aanspreekvorm_aanhef }} {{ achternaam }},"},{"id":"aanleiding_onderhoud","sectie":"aanleiding","v":"aanleiding == 'onderhoud'","g":"aanleiding","o":"Na een bezoek of gesprek met een adviseur","stijl":"","t":"Naar aanleiding van het aangenaam onderhoud tussen u en {{ adviseur }} d.d. {{ datum_aanleiding }} jl. doen wij u hiermede onze aanbieding toekomen voor het leveren en monteren van {{ installatie_omschrijving }} t.b.v. bovengenoemd project."},{"id":"aanleiding_aanvraag","sectie":"aanleiding","v":"aanleiding == 'aanvraag'","g":"aanleiding","o":"Na een aanvraag van de klant","stijl":"","t":"Naar aanleiding van uw aanvraag d.d. {{ datum_aanleiding }} jl. doen wij u hiermede onze aanbieding toekomen voor het leveren en monteren van {{ installatie_omschrijving }} t.b.v. bovengenoemd project."},{"id":"aanleiding_telefonisch","sectie":"aanleiding","v":"aanleiding == 'telefonisch'","g":"aanleiding","o":"Na een telefonische aanvraag","stijl":"","t":"Naar aanl function tokeniseer(s){
  const t=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(c==="'"||c==='"'){const q=c;let j=i+1,v="";while(j<s.length&&s[j]!==q){v+=s[j++]}
      t.push({k:"str",v});i=j+1;continue}
    if(/[0-9]/.test(c)){let j=i,v="";while(j<s.length&&/[0-9.]/.test(s[j])){v+=s[j++]}
      t.push({k:"num",v:parseFloat(v)});i=j;continue}
    if(/[A-Za-z_]/.test(c)){let j=i,v="";while(j<s.length&&/[A-Za-z0-9_]/.test(s[j])){v+=s[j++]}
      t.push({k:"naam",v});i=j;continue}
    const twee=s.slice(i,i+2);
    if(["==","!=",">=","<="].includes(twee)){t.push({k:"op",v:twee});i+=2;continue}
    if("<>().,".includes(c)){t.push({k:c==="("||c===")"?c:(c==="."||c===",")?c:"op",v:c});i++;continue}
    i++;
  }
  return t;
}
function ontleed(tokens){
  let p=0;
  const kijk=()=>tokens[p], hap=()=>tokens[p++];
  const isNaam=v=>kijk()&&kijk().k==="naam"&&kijk().v===v;

  function ternair(){
    const waar=of_();
    if(isNaam("if")){hap();const test=of_();
      let anders={k:"lit",v:""};
      if(isNaam("else")){hap();anders=of_()}
      return {k:"als",test,waar,anders};}
    return waar;
  }
  function of_(){let l=en_();while(isNaam("or")){hap();l={k:"of",l,r:en_()}}return l}
  function en_(){let l=niet();while(isNaam("and")){hap();l={k:"en",l,r:niet()}}return l}
  function niet(){if(isNaam("not")){hap();return {k:"niet",e:niet()}}return vergelijk()}
  function vergelijk(){
    let l=primair();
    while(kijk()&&((kijk().k==="op"&&["==","!=",">","<",">=","<="].includes(kijk().v))||isNaam("in"))){
      const op=hap().v==="in"?"in":tokens[p-1].v;
      l={k:"cmp",op,l,r:primair()};
    }
    return l;
  }
  function primair(){
    const t=kijk();
    if(!t)return {k:"lit",v:null};
    if(t.k==="("){hap();const e=ternair();if(kijk()&&kijk().k===")")hap();return e}
    if(t.k==="str"||t.k==="num"){hap();return {k:"lit",v:t.v}}
    if(t.k==="naam"){
      hap(); let knoop={k:"naam",v:t.v};
      while(kijk()&&(kijk().k==="."||kijk().k==="(")){
        if(kijk().k==="."){hap();const n=hap();knoop={k:"attr",e:knoop,naam:n?n.v:""}}
        else{hap();const args=[];
          while(kijk()&&kijk().k!==")"){args.push(ternair());if(kijk()&&kijk().k===",")hap()}
          if(kijk())hap();
          knoop={k:"roep",naam:knoop.v,args};}
      }
      return knoop;
    }
    hap(); return {k:"lit",v:null};
  }
  return ternair();
}

  telwoord:n=>["nul","één","twee","drie","vier","vijf","zes","zeven","acht","negen","tien"][n]??String(n),
  bedrag:v=>formatBedrag(v),
};
function reken(n,ctx){
  switch(n.k){
    case "lit": return n.v;
    case "naam": return ctx[n.v];
    case "attr": {const d=reken(n.e,ctx); return (d&&typeof d==="object")?d[n.naam]:null}
    case "roep": {const f=FUNCTIES[n.naam]; return f?f(...n.args.map(a=>reken(a,ctx))):null}
    case "niet": return !reken(n.e,ctx);
    case "en": {const l=reken(n.l,ctx); return l?reken(n.r,ctx):l}
    case "of": {const l=reken(n.l,ctx); return l?l:reken(n.r,ctx)}
    case "als": return reken(n.test,ctx)?reken(n.waar,ctx):reken(n.anders,ctx);
    case "cmp": {
      const a=reken(n.l,ctx), b=reken(n.r,ctx);
      switch(n.op){
        case "==":return a===b; case "!=":return a!==b;
        case ">":return a!=null&&b!=null&&a>b; case "<":return a!=null&&b!=null&&a<b;
        case ">=":return a!=null&&b!=null&&a>=b; case "<=":return a!=null&&b!=null&&a<=b;
        case "in":return Array.isArray(b)?b.includes(a):(typeof b==="string"?b.includes(a):false);
      }
      return false;
    }
  }
  return null;
}
const cacheAst=new Map();
function evalueer(expr,ctx){
  if(!expr||!expr.trim())return true;
  if(!cacheAst.has(expr))cacheAst.set(expr,ontleed(tokeniseer(expr)));
  return reken(cacheAst.get(expr),ctx);
}

const MAANDEN=["januari","februari","maart","april","mei","juni","juli","augustus",
  "september","oktober","november","december"];
function formatBedrag(v){
  if(v===null||v===undefined||v==="")return "";
  const n=typeof v==="number"?v:parseFloat(String(v).replace(/[^0-9,.-]/g,"").replace(/\./g,"").replace(",","."));
  if(isNaN(n))return "";
  const heel=Math.trunc(Math.abs(n)), cent=Math.round((Math.abs(n)-heel)*100);
  const dz=heel.toLocaleString("nl-NL");
  return "€ "+(n<0?"-":"")+dz+(cent?","+String(cent).padStart(2,"0"):",-");
}
function formatDatum(iso){
  if(!iso)return "";
  const d=new Date(iso+"T12:00:00");
  if(isNaN(d))return iso;
  return d.getDate()+" "+MAANDEN[d.getMonth()]+" "+d.getFullYear();
}
function formatPostcode(p){
  const k=(p||"").replace(/\s/g,"").toUpperCase();
  return /^[0-9]{4}[A-Z]{2}$/.test(k)?k.slice(0,4)+" "+k.slice(4):(p||"");
}

   ================================================================== */
const LOOP={specificatie:"installaties",prijs:"prijsregels"};
const SECTIES=[...new Set(BLOKKEN.map(b=>b.sectie))];
const verwijstNaarRegel=b=>b.v.includes("regel.")||b.t.includes("regel.");

const KOPPEN_VET=new Set(["Aanbieding","Opdracht","Tot slot","TECHNISCHE SPECIFICATIES",
  "Technische specificaties","Zie bijlage.","Zie bijlagen.","Uitgangspunten:","Elektra:"]);
function regelStijl(tekst,blokStijl){
  const kaal=tekst.trim();
  if(blokStijl==="kopvet")return "kopvet";
  if(blokStijl&&blokStijl!=="label")return blokStijl;
  if(KOPPEN_VET.has(kaal))return "kopvet";
  if(kaal.endsWith(":")&&kaal.length<=45&&!kaal.includes(". "))return "kop";
  return "tekst";
}
function naarAlineas(ingevuld,blok,reden){
  // Spiegelt _naar_alineas in samenstellen.py: Word kent geen regelovergang
  // binnen een alinea, dus elk blok wordt per regel opgesplitst.
  const uit=[];
  for(const regel of ingevuld.split("\n")){
    const kaal=regel.trim();
    if(!kaal)continue;
    const uitgelijnd=regel.startsWith("\t")||regel.startsWith("\u00a0");
    let stijl, tekst;
    if(uitgelijnd){stijl="tekst";tekst=regel.replace(/\s+$/,"")}
    else if(blok.stijl==="opsomming"){stijl="opsomming";tekst=kaal}
    else if(kaal.startsWith("- ")){stijl="opsomming";tekst=kaal.slice(2).trim()}
    else{stijl=regelStijl(kaal,blok.stijl);tekst=kaal}
    uit.push({tekst,blok,stijlRegel:stijl,reden});
  }
  return uit;
}
function vulIn(tekst,ctx){
  return tekst.replace(/\{\{(.+?)\}\}/g,(_,e)=>{
    const w=evalueer(e.trim(),ctx);
    return (w===null||w===undefined||w===false)?"":String(w);
  }).replace(/ {2,}/g," ").split("\n").map(r=>r.replace(/\s+$/,"")).join("\n").trim();
}
function redenVan(blok,ctx){
  if(!blok.v)return null;
  const m=blok.v.match(/([a-z_]+)\s*(==|!=|>|<|>=|<=)\s*'?([^']*)'?/);
  if(m)return {veld:m[1],waarde:ctx[m[1]]};
  const l=blok.v.match(/'([^']+)'\s+in\s+([a-z_]+)/);
  if(l)return {veld:l[2],waarde:l[1]};
  const n=blok.v.match(/^([a-z_]+)$/);
  if(n)return {veld:n[1],waarde:ctx[n[1]]?"ja":"nee"};
  return {veld:blok.v,waarde:""};
}

function stelSamen(){
  const ctx=bouwContext(), uit={}, gebruikt=[];
  const vergeven=new Set();
  for(const sectie of SECTIES){
    const alineas=[], lijst=LOOP[sectie], regels=lijst?(ctx[lijst]||[]):[];
    const blokken=BLOKKEN.filter(b=>b.sectie===sectie);
    let i=0;
    while(i<blokken.length){
      const herhaalt=lijst&&verwijstNaarRegel(blokken[i]);
      const groep=[];
      while(i<blokken.length&&(lijst&&verwijstNaarRegel(blokken[i]))===herhaalt){groep.push(blokken[i++])}
      if(herhaalt){
        regels.forEach((regel,n)=>{
          const lok=Object.assign({},ctx,{regel,regelnummer:n+1});
          for(const b of groep){ if(evalueer(b.v,lok)){
            naarAlineas(vulIn(b.t,lok),b,redenVan(b,lok)).forEach(x=>alineas.push(x));
            gebruikt.push(b.id);}}
        });
      }else{
        for(const b of groep){
          if(b.g&&vergeven.has(b.g))continue;
          if(evalueer(b.v,ctx)){
            naarAlineas(vulIn(b.t,ctx),b,redenVan(b,ctx)).forEach(x=>alineas.push(x));
            gebruikt.push(b.id); if(b.g)vergeven.add(b.g);
          }
        }
      }
    }
    for(const eigen of (A.eigenAlineas[sectie]||[])) alineas.push({tekst:eigen,eigen:true});
    uit[sectie]=alineas;
  }
  return {secties:uit,gebruikt,ctx};
}

    BLOKKEN.filter(b=>b.sectie===veld.sectie&&b.o).forEach(b=>{
      const m=b.v.match(/'([^']+)'\s+in/); if(!m)return;
      const sleutel=m[1];
      const lb=el("label","vink"); const i=el("input"); i.type="checkbox";
      i.checked=A[veld.n].includes(sleutel);
      i.onchange=()=>{
        A[veld.n]=i.checked?[...A[veld.n],sleutel]:A[veld.n].filter(x=>x!==sleutel);
        ververs();
      };
      lb.append(i,el("span",null,b.o)); lijst.appendChild(lb);
    });
    w.appendChild(lijst);
  } else if(veld.t==="installaties"){
    return bouwInstallaties();
  } else if(veld.t==="prijsregels"){
    return bouwPrijsregels();
  } else {
    const i=el("input"); i.id="f-"+veld.n;
    i.type=veld.t==="datum"?"date":"text";
    if(veld.code)i.className="code";
    if(veld.t==="geld"){i.className="geld";i.placeholder="0"}
    i.value=A[veld.n]??"";
    i.oninput=()=>{A[veld.n]=i.value;ververs(true)};
    w.appendChild(i);
  }
  return w;
}

function bouwInstallaties(){
  const w=el("div","veld");
  w.appendChild(Object.assign(el("div","blabel"),{textContent:"Aangeboden installaties"}));
  const houder=el("div","vinklijst"); houder.style.gap="9px";
  A.installaties.forEach((inst,n)=>{
    const k=el("div","kaart");
    const kop=el("div","kaartkop");
    kop.append(el("span","kaartnr","REGEL "+(n+1)));
    if(A.installaties.length>1){
      const x=el("button","weg","×"); x.type="button"; x.title="Regel verwijderen";
      x.onclick=()=>{A.installaties.splice(n,1);ververs()};
      kop.appendChild(x);
    }
    k.appendChild(kop);
    const tekstveld=(sleutel,label,klasse)=>{
      const v=el("div","veld"); v.appendChild(el("label",null,label));
      const i=el("input"); i.type="text"; if(klasse)i.className=klasse;
      i.value=inst[sleutel]??""; i.oninput=()=>{inst[sleutel]=i.value;ververs(true)};
      v.appendChild(i); return v;
    };
    k.appendChild(tekstveld("ruimte","Ruimte of verdieping"));
    const r1=el("div","rij");
    const vs=el("div","veld"); vs.appendChild(el("label",null,"Systeem"));
    const s=el("select");
    [["splitsystem","Split"],["multi-splitsystem","Multi-split"],["vrf","VRF"]].forEach(([v,l])=>{
      const o=el("option",null,l);o.value=v;if(inst.systeemsoort===v)o.selected=true;s.appendChild(o)});
    s.onchange=()=>{inst.systeemsoort=s.value;ververs()};
    vs.appendChild(s); r1.append(vs,tekstveld("merk","Merk"));
    k.appendChild(r1);
    k.appendChild(tekstveld("montagewijze","Montagewijze"));
    k.appendChild(tekstveld("type_binnendeel","Type binnendeel","code"));
    if(inst.systeemsoort!=="splitsystem"){
      const r2=el("div","rij");
      const va=el("div","veld"); va.appendChild(el("label",null,"Aantal binnendelen"));
      const a=el("input"); a.type="number"; a.min="1"; a.value=inst.aantal_binnendelen??1;
      a.oninput=()=>{inst.aantal_binnendelen=parseInt(a.value)||1;ververs()};
      va.appendChild(a);
      r2.append(va,tekstveld("type_buitendeel","Type buitendeel","code"));
      k.appendChild(r2);
    }
    houder.appendChild(k);
  });
  w.appendChild(houder);
  const plus=el("button","toevoeg","+  Installatie toevoegen"); plus.type="button";
  plus.onclick=()=>{A.installaties.push({ruimte:"",aantal_systemen:1,systeemsoort:"splitsystem",
    montagewijze:"wandmontage",merk:"Panasonic",type_binnendeel:""});ververs()};
  w.appendChild(plus);
  return w;
}

function bouwPrijsregels(){
  const w=el("div","veld");
  w.appendChild(Object.assign(el("div","blabel"),{textContent:"Prijsregels"}));
  const houder=el("div","vinklijst"); houder.style.gap="8px";
  A.prijsregels.forEach((r,n)=>{
    const rij=el("div","rij");
    const vp=el("div","veld"); vp.appendChild(el("label",null,"Positie"));
    const p=el("input"); p.type="text"; p.className="code"; p.placeholder="pos. A";
    p.value=r.positie??""; p.oninput=()=>{r.positie=p.value;ververs(true)};
    vp.appendChild(p);
    const vb=el("div","veld");
    const lb=el("label",null,"Bedrag netto"); vb.appendChild(lb);
    const wrap=el("div"); wrap.style.display="flex"; wrap.style.gap="6px";
    const b=el("input"); b.type="text"; b.className="geld"; b.value=r.bedrag??"";
    b.oninput=()=>{r.bedrag=b.value;ververs(true)};
    wrap.appendChild(b);
    if(A.prijsregels.length>1){
      const x=el("button","weg","×"); x.type="button";
      x.onclick=()=>{A.prijsregels.splice(n,1);ververs()};
      wrap.appendChild(x);
    }
    vb.appendChild(wrap); rij.append(vp,vb); houder.appendChild(rij);
  });
  w.appendChild(houder);
  const plus=el("button","toevoeg","+  Prijspositie toevoegen"); plus.type="button";
  plus.onclick=()=>{A.prijsregels.push({positie:"pos. "+String.fromCharCode(65+A.prijsregels.length),bedrag:""});ververs()};
  w.appendChild(plus);
  return w;
}

const KOPPEN=new Set(["Aanbieding","Opdracht","TECHNISCHE SPECIFICATIES","Totaalprijs:","Raamprijs:",
  "Levering:","Facturering en betaling:","Kredietwaardigheid:","Algemene voorwaarden:",
  "Garantietermijn:","Aansprakelijkheid:","Materiaal garantie:","Tot slot","Prijs"]);
const LABELS={klanttype:"soort klant",aantal_binnenunits:"aantal binnenunits",
  aantal_buitenunits:"aantal buitenunits",model_binnenunit:"model binnenunit",
  opstelling_buitenunit:"opstelling buitenunit",condensafvoer:"condensafvoer",
  bediening:"bediening",installatietype:"soort installatie",documentsoort:"soort brief",
  aanleiding:"aanleiding",winterregeling:"winterregeling",storingscontact:"storingscontact",
  werk_inclusief:"wel inbegrepen",werk_exclusief:"niet inbegrepen",
  facturering:"facturering",betaling:"betaling",prijssoort:"soort prijs",
  technische_specificaties:"technische specificaties",coating_optioneel:"coating als optie"};

function tekenBrief(resultaat,alleenNieuw){
  const vel=document.getElementById("vel");
  vel.innerHTML="";
  const c=resultaat.ctx;

  const kop=el("div","velkop");
  const links=el("div"); const naam=el("div","naam"); naam.innerHTML=
    'Schilt Bedrijven B.V.<span>Business Unit Airconditioning</span>';
  links.appendChild(naam); kop.appendChild(links);
  const rechts=el("div","plek");
  rechts.innerHTML="Energieweg 29 · 4231 DJ Meerkerk<br>+31 (0)183 35 25 44<br>schiltbedrijven.nl";
  kop.appendChild(rechts); vel.appendChild(kop);

  const nieuweTekst=new Map();
  for(const sectie of SECTIES){
    const alineas=resultaat.secties[sectie]||[];
    if(!alineas.length)continue;
    const s=el("div","sectie"); s.dataset.sectie=sectie;
    alineas.forEach((a,n)=>{
      const p=el("p","alinea");
      if(a.eigen)p.classList.add("eigen");
      const stijl=a.blok&&a.blok.stijl;
      const eersteRegel=a.tekst.split("\n")[0].trim();
      if(a.stijlRegel==="kop"){p.classList.add("kopregel","onderstreept")}
      else if(a.stijlRegel==="kopvet"){p.classList.add("kopregel","vet")}
      else if(a.stijlRegel==="opsomming"){p.classList.add("opsomming")}
      // In de brieven staat bij een prijsregel het bedrag vet en de zin niet.
      const euro=(stijl==="prijs")?a.tekst.indexOf("\u20ac"):-1;
      if(euro>=0){
        p.appendChild(document.createTextNode(a.tekst.slice(0,euro)));
        p.appendChild(el("b",null,a.tekst.slice(euro)));
      }else{
        p.appendChild(document.createTextNode(a.tekst));
      }
      const sleutel=sectie+"#"+n;
      nieuweTekst.set(sleutel,a.tekst);
      if(alleenNieuw&&vorigeTekst.has(sleutel)&&vorigeTekst.get(sleutel)!==a.tekst){
        p.classList.add("vers"); requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.remove("vers")));
      }
      if(a.reden&&a.reden.veld&&!a.eigen){
        p.dataset.waarom="1";
        const tip=el("div","tip");
        const naamVeld=LABELS[a.reden.veld]||a.reden.veld;
        const w=a.reden.waarde;
        tip.innerHTML="Gekozen omdat <b>"+esc(naamVeld)+"</b> = <b>"+esc(w===true?"ja":w===false?"nee":(w??"—"))+"</b>";
        p.appendChild(tip);
      }
      s.appendChild(p);
    });
    const plus=el("button","plus","+"); plus.type="button";
    plus.title="Eigen alinea toevoegen aan deze sectie";
    plus.onclick=()=>{
      const t=prompt("Eigen alinea toevoegen aan deze sectie:");
      if(t&&t.trim()){(A.eigenAlineas[sectie]=A.eigenAlineas[sectie]||[]).push(t.trim());ververs()}
    };
    s.appendChild(plus);
    vel.appendChild(s);
  }
  vorigeTekst=nieuweTekst;

  const voet=el("div","velvoet");
  voet.textContent="Wij leveren volgens de algemene voorwaarden van de Koninklijke Metaalunie "+
    "(Metaalunievoorwaarden), gedeponeerd ter griffie van de rechtbank te Rotterdam. "+
    "Privacyverklaring: schiltbedrijven.nl/privacyverklaring";
  vel.appendChild(voet);

  document.getElementById("telling").textContent=
    resultaat.gebruikt.length+" tekstblokken · "+
    Object.values(resultaat.secties).reduce((n,a)=>n+a.length,0)+" alinea's";
  document.getElementById("k-project").textContent=A.projectnummer||"—";
  document.getElementById("k-ref").textContent=c.referentie||"—";

  const leeg=[["achternaam","achternaam"],["straat_huisnummer","adres"],["plaats","plaats"],
    ["projectnummer","project no."],["locatieaanduiding","betreft-regel"]]
    .filter(([k])=>!String(A[k]||"").trim()).map(([,l])=>l);
  const geen=!A.prijsregels.some(r=>String(r.bedrag||"").trim());
  if(geen)leeg.push("bedrag");
  const o=document.getElementById("ontbreekt");
  o.textContent=leeg.length?"nog invullen: "+leeg.join(", "):"alles ingevuld";
  o.style.color=leeg.length?"var(--signal)":"var(--muted)";
}

function tekenVragen(ctx){
  const f=document.getElementById("vragen");
  const scroll=f.scrollTop;
  f.innerHTML="";
  for(const g of GROEPEN){
    const d=el("details","groep"); d.open=open.has(g.naam);
    d.addEventListener("toggle",()=>{d.open?open.add(g.naam):open.delete(g.naam)});
    const sm=el("summary");
    sm.append(el("span","pijl"),el("span","gtitel",g.naam),el("span","gsamen",g.samen()));
    d.appendChild(sm);
    const inh=el("div","ginhoud");
    g.velden.forEach(v=>{const k=zetVeld(v,ctx);if(k)inh.appendChild(k)});
    d.appendChild(inh);
    f.appendChild(d);
  }
  f.scrollTop=scroll;
}

let bezigMetTypen=null;
function ververs(alleenBrief){
  const resultaat=stelSamen();
  tekenBrief(resultaat,true);
  if(alleenBrief){
    // Tijdens typen het formulier niet opnieuw opbouwen: dat zou de cursor verplaatsen.
    clearTimeout(bezigMetTypen);
    bezigMetTypen=setTimeout(()=>{
      const actief=document.activeElement;
      if(!actief||actief.tagName!=="INPUT")tekenVragen(resultaat.ctx);
      else{document.querySelectorAll(".gsamen").forEach((e,i)=>{e.textContent=GROEPEN[i].samen()})}
    },350);
    return;
  }
  tekenVragen(resultaat.ctx);
}

  e.currentTarget.classList.toggle("aan",aan);
  e.currentTarget.setAttribute("aria-pressed",String(aan));
};

    "Je opent hem in Word, kijkt hem na en slaat hem op als PDF.");
};
ververs();
